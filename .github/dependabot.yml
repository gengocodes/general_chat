version: 2
updates:
  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Block semver-major updates to TypeScript (e.g. TS 7.x) because typescript-eslint
      # and eslint-config-next hard-fail on TS >= 7.0 until official support lands.
      # Patch and minor releases (5.9.x) will continue to update automatically.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # Block semver-major updates to ESLint (e.g. ESLint 10.x) because peer plugins
      # (eslint-plugin-react, eslint-plugin-jsx-a11y, eslint-plugin-import) currently
      # require ESLint 9. Patch/minor releases (9.39.x) will continue to update automatically.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Bucket-Manager Python dependencies
  - package-ecosystem: "pip"
    directory: "/bucket-manager"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      bucket-manager-dependencies:
        patterns:
          - "*"

  # Document-Processor Python dependencies
  - package-ecosystem: "pip"
    directory: "/document-processor"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      document-processor-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
