version: 2
updates:
  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Bucket-Manager Python dependencies
  - package-ecosystem: "pip"
    directory: "/bucket-manager"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      bucket-manager-dependencies:
        patterns:
          - "*"

  # Document-Processor Python dependencies
  - package-ecosystem: "pip"
    directory: "/document-processor"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      document-processor-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
