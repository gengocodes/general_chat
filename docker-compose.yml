services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genchat-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend/uploads:/app/uploads

    restart: unless-stopped
